name: Security Engineer Agent

on:
  schedule:
    - cron: '0 8 * * 1'      # Secret Scan: wöchentlich (Montag 08:00 UTC)
    - cron: '0 8 1,15 * *'   # Code Audit:  bi-weekly (1. + 15. des Monats)
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_audit:
        description: 'Code Audit zusätzlich ausführen'
        type: boolean
        default: false

permissions:
  contents: read

# ── Job 1: Secret & Config Scan (läuft immer) ────────────────────────────────
jobs:
  secret-scan:
    name: Secret & Config Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout (vollständige Historie)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Security Engineer Agent — Secret Scan
        id: scan
        run: |
          chmod +x scripts/security-scan-repo.sh
          bash scripts/security-scan-repo.sh

      - name: GitHub Issue bei Findings (nur Scheduled Run)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Security] Secret Scan Findings — ${date}`,
              body: [
                '## Security Engineer Agent — Secret Scan Findings',
                '',
                `**Datum:** ${date}`,
                `**Workflow:** [Run ${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                '### Sofort-Maßnahmen',
                '- [ ] Workflow-Logs prüfen (Link oben)',
                '- [ ] Betroffene Dateien identifizieren',
                '- [ ] Secrets aus Git-Historie entfernen (`git filter-repo`)',
                '- [ ] Betroffene Credentials rotieren (Vault Token, Unseal Key)',
                '',
                '> Automatisch erstellt vom Security Engineer Agent.',
              ].join('\n'),
              labels: ['security', 'automated'],
            });

# ── Job 2: Claude Security Engineer Agent (bi-weekly + manual) ───────────────
  code-audit:
    name: Claude Security Engineer Agent (bi-weekly)
    runs-on: ubuntu-latest
    # Runs on: bi-weekly schedule OR manual trigger with run_audit=true
    if: |
      github.event.schedule == '0 8 1,15 * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_audit == true)
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write   # required for OIDC workload identity federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools + Anthropic SDK
        run: |
          pip install --quiet bandit pip-audit checkov anthropic

      - name: Install app dependencies (for pip-audit)
        run: pip install --quiet -r app/requirements.txt || true

      - name: Claude Security Agent — run audit
        id: audit
        # No ANTHROPIC_API_KEY needed — authentication via OIDC workload identity
        # federation. Configure the GitHub Actions OIDC issuer once in the
        # Anthropic Console under Settings → Workload Identity Federation.
        run: |
          python3 scripts/claude-security-agent.py
        continue-on-error: true

      # Clean audit: delete security branch if it exists from a previous run
      - name: Clean up security branch (no incident)
        if: steps.audit.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.audit.outputs.date }}"
          BRANCH="security/audit-${DATE}"
          git push origin --delete "$BRANCH" 2>/dev/null && \
            echo "Branch $BRANCH deleted" || \
            echo "No branch $BRANCH — nothing to do"

      # PR only on CRITICAL or HIGH findings (agent exits 1 in that case)
      - name: Create branch + commit report
        if: steps.audit.outcome == 'failure' && steps.audit.outputs.report_file != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.audit.outputs.date }}"
          BRANCH="security/audit-${DATE}"

          git config user.name "Claude Security Engineer Agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
          mkdir -p security
          git add security/

          if git diff --cached --quiet; then
            echo "No changes — report already committed"
            exit 0
          fi

          git commit -m "security: Claude audit findings ${DATE} — Critical=${{ steps.audit.outputs.critical }} High=${{ steps.audit.outputs.high }}"
          git push origin "$BRANCH" --force

      - name: Open Pull Request (CRITICAL / HIGH only)
        if: steps.audit.outcome == 'failure' && steps.audit.outputs.report_file != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.audit.outputs.date }}"
          BRANCH="security/audit-${DATE}"
          CRITICAL="${{ steps.audit.outputs.critical }}"
          REPORT_FILE="${{ steps.audit.outputs.report_file }}"

          if [ "$CRITICAL" -gt 0 ]; then
            TITLE="🔴 Security Incident ${DATE} — CRITICAL Findings (${{ steps.audit.outputs.critical }}x Critical, ${{ steps.audit.outputs.high }}x High)"
          else
            TITLE="🟠 Security Incident ${DATE} — HIGH Findings (${{ steps.audit.outputs.high }}x High)"
          fi

          EXISTING_PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already exists — updating title"
            gh pr edit "$EXISTING_PR" --title "$TITLE" || true
            exit 0
          fi

          gh pr create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body "$(cat "$REPORT_FILE")" \
            --base main \
            --head "$BRANCH" \
            --label "security" \
            --label "critical" 2>/dev/null || \
          gh pr create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body "$(cat "$REPORT_FILE")" \
            --base main \
            --head "$BRANCH"
